name: CI

on:
  push:
    branches: [main, "feat/**", "agent/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - name: Tester registry guard check
        run: node --check tester-registry-guard.js && node tests/tester-registry-guard-check.mjs
      - name: Tester MutationObserver loop check
        run: node tests/tester-mutation-loop-check.mjs
      - name: Cross-tab guest world-write check
        run: node tests/cross-tab-guest-world-write-check.mjs
      - name: Cross-tab authenticated world check
        run: node tests/cross-tab-authenticated-world-check.mjs
      - name: Supabase recovery wiring check
        run: node tests/supabase-recovery-wiring-check.mjs
      - name: Probe live tester login RPC
        id: tester_login
        run: node tests/tester-auth-live-check.mjs probe-login
      - name: "FAIL: tester Supabase host DNS error"
        if: steps.tester_login.outputs.category == 'DNS_ERROR'
        run: exit 1
      - name: "FAIL: tester Supabase network error"
        if: steps.tester_login.outputs.category == 'NETWORK_ERROR'
        run: exit 1
      - name: "FAIL: tester auth publishable key rejected"
        if: steps.tester_login.outputs.category == 'INVALID_API_KEY'
        run: exit 1
      - name: "FAIL: tester auth JWT/header error"
        if: steps.tester_login.outputs.category == 'JWT_ERROR'
        run: exit 1
      - name: "FAIL: tester auth RPC permission denied"
        if: steps.tester_login.outputs.category == 'PERMISSION_DENIED'
        run: exit 1
      - name: "FAIL: tester login RPC missing"
        if: steps.tester_login.outputs.category == 'MISSING_FUNCTION'
        run: exit 1
      - name: "FAIL: tester login RPC other HTTP error"
        if: steps.tester_login.outputs.category != 'OK' && steps.tester_login.outputs.category != 'DNS_ERROR' && steps.tester_login.outputs.category != 'NETWORK_ERROR' && steps.tester_login.outputs.category != 'INVALID_API_KEY' && steps.tester_login.outputs.category != 'JWT_ERROR' && steps.tester_login.outputs.category != 'PERMISSION_DENIED' && steps.tester_login.outputs.category != 'MISSING_FUNCTION'
        run: exit 1
      - name: Live tester signup RPC probe
        if: steps.tester_login.outputs.category == 'OK'
        run: node tests/tester-auth-live-check.mjs signup
      - name: Live cloud state RPC probe
        if: steps.tester_login.outputs.category == 'OK'
        run: node tests/tester-auth-live-check.mjs cloud
