name: CI

on:
  push:
    branches: [main, "feat/**", "agent/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - name: Live tester auth RPC probe
        run: node tests/tester-auth-live-check.mjs
