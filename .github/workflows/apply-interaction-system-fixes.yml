name: Apply Interaction System Fixes
on:
  push:
    branches: [agent/fix-interaction-system-v040]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-interaction-system-v040
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Harden temporary patch helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-interaction-system-fixes.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('re.subn(pattern, replacement, text, count=1, flags=flags)', 're.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)')
          s = s.replace('${actorSubject} ${targetName}을 향해 선언한 행동을 그대로 이어간다.', '${actorSubject} ${targetObject} 향해 선언한 행동을 그대로 이어간다.')
          s = s.replace('  assert.doesNotMatch(server, /이어어서 상대의 반응/);\n  assert.doesNotMatch(server, /이어져서 상대의 반응/);', '  assert.doesNotMatch(server, /이어서 상대의 반응/);')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply fixes
        run: python scripts/apply-interaction-system-fixes.py
      - name: Align escaped cache-key assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              r'app\\.js\\?v=0\\.3\\.18': r'app\\.js\\?v=0\\.4\\.1',
              r'observation-ai-sync\\.js\\?v=0\\.3\\.34': r'observation-ai-sync\\.js\\?v=0\\.4\\.1',
              r'action-log-sync\\.js\\?v=0\\.3\\.33': r'action-log-sync\\.js\\?v=0\\.4\\.1',
              r'character-interaction-ai\\.js\\?v=0\\.3\\.98': r'character-interaction-ai\\.js\\?v=0\\.4\\.1',
              r'character-interaction-result-visibility-fix\\.js\\?v=0\\.3\\.101': r'character-interaction-result-visibility-fix\\.js\\?v=0\\.4\\.1',
          }
          for path in Path('tests').glob('*.mjs'):
              s = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  s = s.replace(old, new)
              path.write_text(s, encoding='utf-8')
          PY
      - name: Run regression suite
        run: npm run check
      - name: Commit clean patch
        run: |
          git config user.name "NAM5AN"
          git config user.email "133747621+NAM5AN@users.noreply.github.com"
          git rm scripts/apply-interaction-system-fixes.py .github/workflows/apply-interaction-system-fixes.yml
          git add -A
          git commit -m "fix: stabilize same-field interaction narration and sending"
          git push origin HEAD:agent/fix-interaction-system-v040
