<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1113" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>백지도시 · 관리자 관제판</title>
  <link rel="stylesheet" href="admin-dashboard.css?v=0.1.1&stage4d=1" />
  <link rel="stylesheet" href="admin-log-recipient-grouping.css?v=0.6.4" />
  <link rel="stylesheet" href="admin-zone-map.css?v=0.6.1" />
  <link rel="stylesheet" href="admin-observation-mvp2.css?v=0.2.1&stage4c=1" />
  <link rel="stylesheet" href="admin-communications-mvp3.css?v=0.3.0" />
  <link rel="stylesheet" href="admin-chat-mobile-mvp3.css?v=0.3.1" />
  <link rel="stylesheet" href="admin-control-mvp4.css?v=0.4.3&stage4-item-transfer=1&item-disposition=1&field-item-management=1" />
  <link rel="stylesheet" href="admin-session-ops-mvp5.css?v=0.5.0" />
  <link rel="stylesheet" href="admin-mobile-shell-polish.css?v=0.6.2" />
</head>
<body>
  <div class="admin-shell" id="admin-shell">
    <header class="admin-topbar">
      <div class="admin-brand">
        <span class="admin-brand-mark">白</span>
        <div><strong>백지도시 관제판</strong><small>OBSERVE · COMMUNICATION · CONTROL · OPERATIONS · MVP 5</small></div>
      </div>
      <div class="admin-topbar-meta">
        <span data-admin-world-meta>연결 대기</span>
        <span class="admin-status" data-admin-connection hidden>LOCKED</span>
      </div>
    </header>

    <main class="admin-workspace">
      <section class="admin-console" aria-label="관리자 관제판">
        <nav class="admin-tabs" aria-label="관제 탭">
          <button type="button" class="active" data-admin-tab="overview">전체 현황</button>
          <button type="button" data-admin-tab="zones">구역</button>
          <button type="button" data-admin-tab="parties">조사조</button>
          <button type="button" data-admin-tab="characters">캐릭터</button>
          <button type="button" data-admin-tab="logs">로그</button>
        </nav>
        <section class="admin-panel" data-admin-panel aria-live="polite"></section>
      </section>

      <aside class="admin-chat-rail" aria-label="관리자 채팅">
        <div class="admin-chat-head">
          <div><strong>관리자 채팅</strong><small>운영진 통신 연결 중</small></div>
          <span class="admin-chat-badge">MVP 3</span>
        </div>
        <div class="admin-chat-placeholder"><strong>관리자 통신 연결 중...</strong></div>
        <div class="admin-chat-compose disabled" aria-disabled="true">
          <textarea disabled placeholder="연결 중..."></textarea>
          <div><button type="button" disabled>운영 SYSTEM 전송</button><button type="button" disabled>보내기</button></div>
        </div>
      </aside>
    </main>
  </div>

  <div id="admin-modal-root"></div>
  <script src="data/day1-data.js?v=0.3.18"></script>
  <script src="admin-canonical-zones.js?v=0.5.4"></script>
  <script src="admin-shell-runtime.js?v=0.1.0"></script>
  <script src="admin-dashboard.js?v=0.1.2&shell-runtime=1&stage4d=1"></script>
  <script src="admin-log-recipient-grouping.js?v=0.6.6"></script>
  <script src="admin-zone-topology.js?v=0.1.0&stage4b=1"></script>
  <script src="admin-zone-map.js?v=0.6.1&stage4b=1"></script>
  <script src="admin-live-render.js?v=0.6.4&stage4b=1"></script>
  <script src="admin-scroll-stability.js?v=0.6.1"></script>
  <script src="admin-log-bottom-chronology.js?v=0.6.5"></script>
  <script src="admin-transfer-log-fix.js?v=0.5.2"></script>
  <script src="admin-observation-mvp2.js?v=0.2.2&shell-runtime=1&stage4c=1"></script>
  <script src="admin-communications-mvp3.js?v=0.3.1&stage7b=1"></script>
  <script src="admin-chat-mobile-mvp3.js?v=0.3.1"></script>
  <script src="admin-control-mvp4.js?v=0.4.7&stage4-item-transfer=1&lazy-entry=1&async-entry=1&shell-capture=1&item-disposition=1&field-item-management=1"></script>
  <script src="admin-session-ops-mvp5.js?v=0.5.1&shell-runtime=1"></script>
  <script src="admin-world-reset.js?v=0.5.1"></script>
  <script src="admin-mobile-topbar.js?v=0.6.2"></script>
</body>
</html>
